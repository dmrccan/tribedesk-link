<!doctype html>
<!--
  TribeDesk link page. Teams (and other chats) only make http(s) links clickable, so TribeDesk copies
  https://<this page>/#<type>/<id>; this page opens tribedesk://<type>/<id> at once. The id is after the
  "#", which a browser never sends to the server. No data, no tracking, no other requests.
  Published on GitHub Pages from the public repo github.com/dmrccan/tribedesk-link (keep the two the same);
  the address is LINK_PAGE_URL in renderer/src/util/deepLink.js.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Open in TribeDesk</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f6f5fa; color: #1f1d2b; font: 15px/1.5 "Segoe UI", Arial, sans-serif; }
      main { max-width: 420px; padding: 32px; background: #fff; border: 1px solid #e3e1ec; border-radius: 14px; box-shadow: 0 8px 28px rgba(31, 29, 43, 0.08); text-align: center; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; color: #6b6880; }
      a.btn { display: inline-block; margin: 4px; padding: 9px 18px; border-radius: 9px; text-decoration: none; font-weight: 600; }
      .primary { background: #5b3df5; color: #fff; }
      .ghost { border: 1px solid #e3e1ec; color: #1f1d2b; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Opening TribeDesk…</h1>
      <p id="text">If TribeDesk doesn't open, click the button below. Your browser may ask whether to open TribeDesk; tick "Always allow" to skip that next time.</p>
      <div id="buttons">
        <a class="btn primary" id="open" href="#">Open in TribeDesk</a>
        <a class="btn ghost" id="tribe" href="#">Open in TribeCRM</a>
      </div>
    </main>
    <script>
      (function () {
        var m = /^#(project|ticket|task)\/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$/.exec(location.hash);
        if (!m) {
          document.getElementById('title').textContent = 'This link is not complete';
          document.getElementById('text').className = 'error';
          document.getElementById('text').textContent = 'Ask for the link again, or copy it with "Copy TribeDesk link" in TribeDesk.';
          document.getElementById('buttons').style.display = 'none';
          return;
        }
        var app = 'tribedesk://' + m[1] + '/' + m[2].toLowerCase();
        document.title = 'Open the ' + m[1] + ' in TribeDesk';
        document.getElementById('open').href = app;
        document.getElementById('tribe').href = 'https://app.tribecrm.nl/entity/' + m[2].toLowerCase();

        // Once TribeDesk has been asked to open, this tab has done its job and closes itself. Not while the
        // browser asks "Open TribeDesk?" (closing the tab would close that question too): the question takes
        // the focus, so the tab closes when the focus comes back (after "Open"), or when the person comes back
        // to the tab later (TribeDesk took the focus). A browser only lets a page close a tab that holds
        // nothing else (one page in its history), as when the link was clicked in Teams or Outlook.
        var left = false;
        function closeTab() {
          window.close();
          // Still open: the browser doesn't let a page close a tab with more than one page in its history
          // (Teams sends links through a Safe Links page first). Then a calm "done" instead.
          setTimeout(function () {
            document.getElementById('title').textContent = '✓ Opened in TribeDesk';
            document.getElementById('text').textContent = 'You can close this tab (Ctrl+W).';
            document.getElementById('open').className = 'btn ghost';
            document.getElementById('open').textContent = 'Open again';
            document.getElementById('tribe').style.display = 'none';
          }, 300);
        }
        window.addEventListener('blur', function () {
          left = true;
        });
        window.addEventListener('focus', function () {
          if (left) setTimeout(closeTab, 300);
        });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible' && left) setTimeout(closeTab, 300);
        });
        document.getElementById('open').addEventListener('click', function () {
          left = false;
        });
        location.href = app;
      })();
    </script>
  </body>
</html>
